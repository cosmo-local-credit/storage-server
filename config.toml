[metrics]
enable = true

[api]
address = ":5003"
max_body_size = 5
origin = ["https://sarafu.network", "https://preview.sarafu.network", "http://localhost:3000"]
allowed_folders = ["voucher", "profile"]
cdn_base_url = "https://content.sarafu.network"
upload_timeout = "60s"

[image]
allowed_widths           = [400, 800, 1280]
quality                  = 82
method                   = 6
max_pixels               = 50000000
materially_smaller_ratio = 0.90
min_psnr                 = 30
normalize_concurrency    = 4

[auth]
# Ed25519 public key matching clc-core's signing key. Never configure its private key.
public_key = """
-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEAd5osN95MX4qOplzCcXvWggSe79YKbJLJbQWEaL0sRnE=
-----END PUBLIC KEY-----"""
clock_skew = "30s"

[s3]
endpoint = ""
access_key_id = ""
secret_access_key = ""
bucket_name = "sarafu-network"
